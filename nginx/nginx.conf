# Reverse proxy in front of however many `backend` replicas are
# running (docker compose -f docker-compose.yml -f docker-compose.prod.yml
# up --scale backend=3), so the app is reachable on one stable port
# regardless of replica count.
#
# The `resolver` + `set $backend_upstream` + variable-based proxy_pass
# below is a deliberate pattern, not an oversight: a plain
# `proxy_pass http://backend:8000;` resolves the `backend` DNS name
# ONCE, when nginx starts, and caches that single IP forever — so with
# multiple replicas you'd pin to whichever one happened to answer
# first and never reach the others. Docker Compose's plain (non-Swarm)
# multi-replica scaling relies on its embedded DNS server (127.0.0.11)
# returning a different A record on each fresh lookup instead of doing
# the load-balancing itself, so nginx has to be told to actually
# re-resolve per request (`resolver ... valid=5s` + the `set`
# indirection) rather than caching the first answer. This is nginx's
# standard workaround for load-balancing scaled plain-Compose services
# without Swarm mode's built-in routing mesh.
#
# NOT verified end-to-end against a live multi-replica deployment in
# the sandbox this was written in (no Docker daemon available there) —
# please confirm request distribution across replicas before relying
# on this in production (e.g. temporarily log the container hostname
# per request and watch it rotate under load).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location /api/health {
            # Answer locally rather than proxying — lets you check nginx
            # itself is up independent of whether any backend replica is.
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        location / {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Webhook payloads and knowledge-doc uploads can be slow/large;
            # don't let nginx time out ahead of the app itself.
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 25m;
        }
    }
}
